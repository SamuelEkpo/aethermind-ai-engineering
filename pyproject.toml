[project]
name = "aethermind"
version = "0.1.0"
description = "AetherMind — AI software engineering & programming intelligence platform"
authors = [{ name = "Samuel Ekpo", email = "samueljackie157@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.4,<25.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4,<3.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "sentencepiece>=0.2,<1.0",
    "tokenizers>=0.20,<1.0",
    "faiss-cpu>=1.9,<2.0",
    "mlflow>=2.17,<3.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps", "packages"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=apps --cov=packages --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__init__.py"]
